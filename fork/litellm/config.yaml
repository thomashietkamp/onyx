# Models the LiteLLM Proxy serves. Onyx lists them with "Refresh models".
# Keys come from fork/litellm/.env through os.environ/<NAME>; never put a key
# in this file. Remove a model block you do not use, or Onyx lists it and
# its calls fail.
model_list:
  # Azure OpenAI. AZURE_OPENAI_GPT4O_MODEL is azure/<your deployment name>.
  - model_name: gpt-4o
    litellm_params:
      model: os.environ/AZURE_OPENAI_GPT4O_MODEL
      api_base: os.environ/AZURE_OPENAI_API_BASE
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_version: os.environ/AZURE_OPENAI_API_VERSION
    model_info:
      max_input_tokens: 128000

  # Claude on Azure AI Foundry. AZURE_CLAUDE_MODEL is azure_ai/<deployment>,
  # and the api_base is https://<resource>.services.ai.azure.com/anthropic.
  - model_name: claude-sonnet
    litellm_params:
      model: os.environ/AZURE_CLAUDE_MODEL
      api_base: os.environ/AZURE_CLAUDE_API_BASE
      api_key: os.environ/AZURE_CLAUDE_API_KEY
    model_info:
      max_input_tokens: 200000

  # Claude directly from Anthropic. Uncomment and set ANTHROPIC_API_KEY.
  # - model_name: claude-sonnet-anthropic
  #   litellm_params:
  #     model: anthropic/claude-sonnet-4-5
  #     api_key: os.environ/ANTHROPIC_API_KEY

  # A self-hosted model behind an OpenAI-compatible server (vLLM, Ollama,
  # LM Studio, TGI). Uncomment and point SELF_HOSTED_API_BASE at it, for
  # example http://vllm:8000/v1 or http://ollama:11434/v1.
  # - model_name: llama-3.3-70b
  #   litellm_params:
  #     model: openai/meta-llama/Llama-3.3-70B-Instruct
  #     api_base: os.environ/SELF_HOSTED_API_BASE
  #     api_key: os.environ/SELF_HOSTED_API_KEY
  #   model_info:
  #     max_input_tokens: 128000

litellm_settings:
  # Keep request content out of the proxy logs.
  turn_off_message_logging: true
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
